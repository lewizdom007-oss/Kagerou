name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kagerou APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        working-directory: app
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: app
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Kagerou-release-apk
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
